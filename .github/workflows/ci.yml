name: DevSecOps CI/CD Pipeline with DAST & Security Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # 🔹 Job 1: Статический анализ (SAST + SCA)
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest bandit flake8

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Bandit SAST
        run: |
          bandit -r flaskr/ -ll -f json -o bandit-report.json || true
          bandit -r flaskr/ -ll

      - name: Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-report.json"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            trivy-report.json

  # 🔹 Job 2: Динамический анализ (DAST) с OWASP ZAP
  dast-scan:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: 
          python -m pip install --upgrade pip 
          pip install -r requirements.txt
          pip install -e .
          pip install pytest flake8 pbr

      - name: Start Flask app
        run: |
          flask --app flaskr run --host=0.0.0.0 --port=5000 &
          sleep 10
          curl -f http://localhost:5000 || exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk:rw \
            --add-host=host.docker.internal:host-gateway \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://host.docker.internal:5000 \
            -J zap-report.json \
            -r zap-report.html \
            || echo "ZAP scan completed with findings"

      - name: Upload DAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: zap-reports/

  # 🔹 Job 3: Security Gate + Автокомментарий в PR
  security-gate:
    runs-on: ubuntu-latest
    needs: [static-analysis, dast-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: sast-reports/

      - name: Download DAST reports
        uses: actions/download-artifact@v4
        with:
          name: dast-reports
          path: dast-reports/

      - name: Security Gate - Check CRITICAL/HIGH
        run: |
          echo " Checking Trivy for CRITICAL vulnerabilities..."
          if [ -f sast-reports/trivy-report.json ]; then
            CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' sast-reports/trivy-report.json)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::🚨 Found $CRITICAL_COUNT CRITICAL vulnerabilities! Release blocked."
              exit 1
            fi
          fi

          echo "🔍 Checking ZAP for HIGH risk alerts..."
          if [ -f dast-reports/zap-report.json ]; then
            HIGH_COUNT=$(jq '[.site[]?.alerts[]? | select(.risk=="High")] | length' dast-reports/zap-report.json)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "::error::🕷 Found $HIGH_COUNT HIGH risk vulnerabilities from ZAP! Release blocked."
              exit 1
            fi
          fi
          echo "✅ All security gates passed!"

      - name: Comment PR with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🛡 Security Scan Results\n\n';
            
            // Trivy
            if (fs.existsSync('sast-reports/trivy-report.json')) {
              const trivy = JSON.parse(fs.readFileSync('sast-reports/trivy-report.json', 'utf8'));
              const vulns = [];
              (trivy.Results || []).forEach(r => {
                (r.Vulnerabilities || []).forEach(v => {
                  if (['CRITICAL','HIGH'].includes(v.Severity)) {
                    vulns.push(`| ${v.Severity} | ${r.Target} | ${v.VulnerabilityID} | ${v.FixedVersion || 'N/A'} |`);
                  }
                });
              });
              if (vulns.length > 0) {
                comment += '###  Dependency Vulnerabilities (Trivy)\n\n';
                comment += '| Severity | Package | CVE | Fixed Version |\n|----------|---------|-----|---------------|\n';
                comment += vulns.join('\n') + '\n\n';
              } else {
                comment += '**✅ No CRITICAL/HIGH vulnerabilities in dependencies**\n\n';
              }
            }

            // ZAP
            if (fs.existsSync('dast-reports/zap-report.json')) {
              const zap = JSON.parse(fs.readFileSync('dast-reports/zap-report.json', 'utf8'));
              const alerts = (zap.site && zap.site[0] && zap.site[0].alerts) ? zap.site[0].alerts : [];
              const high = alerts.filter(a => a.risk === 'High').length;
              const medium = alerts.filter(a => a.risk === 'Medium').length;
              comment += '### 🕷 DAST Findings (OWASP ZAP)\n\n';
              comment += `- 🔴 HIGH risk alerts: **${high}**\n-  MEDIUM risk alerts: **${medium}**\n\n`;
            }

            comment += '---\n💡 *Recommendations: Fix CRITICAL/HIGH issues before merging. Use GitHub Secrets for config.*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });